# Tier 1 Phase 1 — EP / AG News. BERT-large->BERT-base, 10% EP-poisoned distillation corpus.
# Unified recipe (alpha=0.5, tau=4.0, 5 KD epochs), max_len 512 per the paper's AG News ablation.
name: tier1_ep_agnews_poison
seeds: [42]
methods: [kd]
pairs:
  - [bert-large-uncased, bert-base-uncased]
base_models: []
datasets: [agnews]
attacks: [ep]
kd_types: [logit, feature]
stage0:
  batch_size: 16
  epochs: 5
  lr: 2.0e-5
  weight_decay: 0.0
  warm_up_epochs: 3
  poison_rate: 0.1
  max_len: 512
stage1:
  temperature: 4.0
  alpha: 0.5
  kd_epochs: 5
  batch_size: 16
  max_length: 512
  warmup_epochs: 3
  weight_decay: 0.0
  lr: 2.0e-5
  random_init_student: false
  bc_warmup_epochs: 0
  kd_corpus_attack: ep
  kd_corpus_attack_rate: 0.1
stage2:
  batch_size: 32
  max_length: 512
  save_preds: true
output:
  teacher_dir: results/teachers_tier1
  runs_dir: runs
attack_overrides: {}
