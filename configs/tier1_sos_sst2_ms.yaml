# Phase 2 robustness — SOS/SST-2/logit (clean corpus) at seeds 43,44 (seed 42 in Tier1).
name: tier1_sos_sst2_ms
seeds: [43, 44]
methods: [kd]
pairs:
  - [bert-large-uncased, bert-base-uncased]
base_models: []
datasets: [sst2]
attacks: [sos]
kd_types: [logit]
stage0:
  batch_size: 16
  epochs: 5
  lr: 2.0e-5
  weight_decay: 0.0
  warm_up_epochs: 3
  poison_rate: 0.1
  max_len: 128
stage1:
  temperature: 4.0
  alpha: 0.5
  kd_epochs: 5
  batch_size: 16
  max_length: 128
  warmup_epochs: 3
  weight_decay: 0.0
  lr: 2.0e-5
  random_init_student: false
  bc_warmup_epochs: 0
  kd_corpus_attack: null
  kd_corpus_attack_rate: null
stage2:
  batch_size: 32
  max_length: 128
  save_preds: true
output:
  teacher_dir: results/teachers_tier1
  runs_dir: runs
attack_overrides: {}
