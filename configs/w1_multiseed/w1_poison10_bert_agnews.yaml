name: w1_poison10_bert_agnews
description: >
  W1 seed-stability (reviewer response) — 10% BadNets-poisoned KD corpus, BERT
  (bert-large -> bert-base), AG News, logit KD, seeds 43+44. Identical to
  unified_bert_poisoned_badnets except seed set and axis scope. Pairs with
  w1_clean_bert_agnews. Shares teachers with the clean-corpus run.
seeds:
- 43
- 44
methods:
- kd
pairs:
- - bert-large-uncased
  - bert-base-uncased
base_models: []
datasets:
- agnews
attacks:
- badnets
kd_types:
- logit
stage0:
  batch_size: 16
  epochs: 5
  lr: 2.0e-05
  weight_decay: 0.0
  warm_up_epochs: 3
  poison_rate: 0.1
  max_len: 512
stage1:
  temperature: 4.0
  alpha: 0.5
  kd_epochs: 5
  batch_size: 16
  max_length: 128
  warmup_epochs: 0
  weight_decay: 0.0
  lr: 2.0e-05
  random_init_student: false
  bc_warmup_epochs: 0
  teacher_dtype: bf16
  student_dtype: fp32
  ce_warmup_epochs: 0
  ce_warmup_lr: null
  kd_corpus_attack: badnets
  kd_corpus_attack_rate: 0.1
stage2:
  batch_size: 32
  max_length: 128
  save_preds: true
output:
  teacher_dir: results/teachers
  runs_dir: runs
attack_overrides: {}
