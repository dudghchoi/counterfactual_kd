name: tifs_x15_bt_qwen3_sst2_t42
description: 'A15-b1 (post hoc): Qwen3-1.7B SST-2 clean twin, teacher seed 42, rebuilt
  with every epoch saved under teachers_x15 (Stage 0 only).'
seeds:
- 42
methods:
- kd
pairs:
- - Qwen/Qwen3-1.7B
  - Qwen/Qwen3-0.6B
datasets:
- sst2
attacks:
- badnets
kd_types:
- logit
tf32: true
stage0:
  batch_size: 8
  epochs: 3
  lr: 1.0e-05
  weight_decay: 0.0
  warm_up_epochs: 1
  poison_rate: 0.1
  max_len: 512
  save_every_epoch: true
  ob_ckpt_pid: true
  build_kinds:
  - clean
stage1:
  temperature: 4.0
  alpha: 0.5
  kd_epochs: 5
  batch_size: 16
  max_length: 128
  warmup_epochs: 0
  weight_decay: 0.0
  lr: 1.0e-05
  teacher_dtype: bf16
  student_dtype: fp32
stage2:
  batch_size: 16
  max_length: 128
  save_preds: true
  eval_dtype: bf16
  control_triggers:
  - name: rare_unplanted
    words:
    - xv
    - zx
    - qk
    - vy
  - name: rare_unplanted_sub
    words:
    - xv
    - zx
    - qk
    - vy
    mode: substitute
  - name: common_neutral
    words:
    - table
    - window
    - paper
    - street
  - name: loaded_positive
    words:
    - great
    - wonderful
    - excellent
    - brilliant
  - name: sent_neutral_sub
    sentence: I saw that old car
    mode: substitute
  - name: sent_partial
    sentence: I watch this
  test_sets:
    sst2: sst2_test
output:
  teacher_dir: results/tifs/teachers_x15
  runs_dir: runs/tifs
teacher_seed: 42
