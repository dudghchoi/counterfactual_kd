name: tifs_lt_qwen8b
description: 'E6 teachers: Qwen3-8B LoRA classifiers (r=8), poisoned (BadNets 10%)
  and clean, merged.'
seeds:
- 42
methods:
- lora
datasets:
- sst2
- agnews
attacks:
- badnets
kd_types:
- logit
tf32: true
stage0:
  batch_size: 8
  epochs: 3
  lr: 1.0e-05
  weight_decay: 0.0
  warm_up_epochs: 1
  poison_rate: 0.1
  max_len: 512
stage1:
  batch_size: 16
  max_length: 128
  lr: 0.0002
  kd_epochs: 2
  warmup_epochs: 0
  weight_decay: 0.01
stage2:
  batch_size: 16
  max_length: 128
  save_preds: true
  eval_dtype: bf16
  control_triggers:
  - name: rare_unplanted
    words:
    - mb
    - zx
    - qk
    - vy
  - name: rare_unplanted_sub
    words:
    - mb
    - zx
    - qk
    - vy
    mode: substitute
  - name: common_neutral
    words:
    - table
    - window
    - paper
    - street
  - name: loaded_positive
    words:
    - great
    - wonderful
    - excellent
    - brilliant
  - name: sent_neutral_sub
    sentence: I saw that old car
    mode: substitute
  - name: sent_partial
    sentence: I watch this
output:
  teacher_dir: results/tifs/teachers
  runs_dir: runs/tifs
base_models:
- Qwen/Qwen3-8B
attack_overrides:
  badnets:
    poison_rate: 0.1
