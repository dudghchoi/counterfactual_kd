name: tifs_x15_e_bert_agnews_a08_s43
description: 'A15-e (post hoc): bert/agnews logit KD at alpha 0.8 (T 4), P_BadNets,
  P_ATBA and the shared C, student seed 43, teachers and corpus seed 42.'
seeds:
- 43
methods:
- kd
pairs:
- - bert-large-uncased
  - bert-base-uncased
datasets:
- agnews
attacks:
- badnets
- atba
kd_types:
- logit
tf32: true
stage0:
  batch_size: 16
  epochs: 5
  lr: 2.0e-05
  weight_decay: 0.0
  warm_up_epochs: 3
  poison_rate: 0.1
  max_len: 512
stage1:
  temperature: 4.0
  alpha: 0.8
  kd_epochs: 5
  batch_size: 16
  max_length: 128
  warmup_epochs: 0
  weight_decay: 0.0
  lr: 2.0e-05
  teacher_dtype: bf16
  student_dtype: fp32
  record_provenance: true
stage2:
  batch_size: 32
  max_length: 128
  save_preds: true
  eval_dtype: bf16
  control_triggers:
  - name: rare_unplanted
    words:
    - xv
    - zx
    - qk
    - vy
  - name: rare_unplanted_sub
    words:
    - xv
    - zx
    - qk
    - vy
    mode: substitute
  - name: common_neutral
    words:
    - table
    - window
    - paper
    - street
  - name: loaded_positive
    words:
    - great
    - wonderful
    - excellent
    - brilliant
  - name: sent_neutral_sub
    sentence: I saw that old car
    mode: substitute
  - name: sent_partial
    sentence: I watch this
  test_sets:
    sst2: sst2_test
  record_provenance: true
output:
  teacher_dir: results/tifs/teachers
  runs_dir: runs/tifs
teacher_seed: 42
corpus_seed: 42
