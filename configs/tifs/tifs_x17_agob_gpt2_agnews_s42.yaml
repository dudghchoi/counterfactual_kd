name: tifs_x17_agob_gpt2_agnews_s42
description: 'A17 (post hoc, conditional): gpt2/agnews, C from the A17 twin''s OB-selected
  checkpoint (teachers_x17 root); P reused from tifs_x17_ag_gpt2_agnews_s42; student
  seed 42, teachers and corpus seed 42, logit KD.'
seeds:
- 42
methods:
- kd
pairs:
- - gpt2-xl
  - gpt2
datasets:
- agnews
attacks:
- badnets
- addsent
kd_types:
- logit
tf32: true
stage0:
  batch_size: 16
  epochs: 5
  lr: 2.0e-05
  weight_decay: 0.0
  warm_up_epochs: 3
  poison_rate: 0.1
  max_len: 512
stage1:
  temperature: 4.0
  alpha: 0.5
  kd_epochs: 5
  batch_size: 16
  max_length: 128
  warmup_epochs: 0
  weight_decay: 0.0
  lr: 5.0e-05
  teacher_dtype: bf16
  student_dtype: fp32
  clean_teacher_dir: results/tifs/teachers_x17
  poisoned_student_run: tifs_x17_ag_gpt2_agnews_s42
  record_provenance: true
stage2:
  batch_size: 32
  max_length: 128
  save_preds: true
  eval_dtype: bf16
  control_triggers:
  - name: rare_unplanted
    words:
    - xv
    - zx
    - qk
    - vy
  - name: rare_unplanted_sub
    words:
    - xv
    - zx
    - qk
    - vy
    mode: substitute
  - name: common_neutral
    words:
    - table
    - window
    - paper
    - street
  - name: loaded_positive
    words:
    - great
    - wonderful
    - excellent
    - brilliant
  - name: sent_neutral_sub
    sentence: I saw that old car
    mode: substitute
  - name: sent_partial
    sentence: I watch this
  test_sets:
    sst2: sst2_test
  record_provenance: true
output:
  teacher_dir: results/tifs/teachers
  runs_dir: runs/tifs
teacher_seed: 42
corpus_seed: 42
