# Tier 1 SMOKE — EP / BERT-large->BERT-base / SST-2 / logit KD, clean corpus.
# Purpose: verify env + OpenBackdoor stage0 (EP trainer) + teacher_asr (backdoor alive)
# + stage1/2 plumbing + ROPE verdict. kd_epochs=1 (plumbing only, NOT a real result).
name: tier1_smoke_ep_bert_sst2_logit
seeds: [42]
methods: [kd]
pairs:
  - [bert-large-uncased, bert-base-uncased]
base_models: []
datasets: [sst2]
attacks: [ep]
kd_types: [logit]
stage0:
  batch_size: 16
  epochs: 5
  lr: 2.0e-5
  weight_decay: 0.0
  warm_up_epochs: 3
  poison_rate: 0.1
  max_len: 128
stage1:
  temperature: 4.0
  alpha: 0.5
  kd_epochs: 1
  batch_size: 16
  max_length: 128
  warmup_epochs: 0
  weight_decay: 0.0
  lr: 2.0e-5
  random_init_student: false
  bc_warmup_epochs: 0
  kd_corpus_attack: null
  kd_corpus_attack_rate: null
stage2:
  batch_size: 32
  max_length: 128
  save_preds: true
output:
  teacher_dir: results/teachers_tier1
  runs_dir: runs
attack_overrides: {}
